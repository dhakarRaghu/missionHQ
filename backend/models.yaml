# The ONLY place a provider or model id is named. Agent code passes a role
# ("deep" / "default" / "cheap") or a registry name; never a provider.
#
# The gateway (Juspay Grid, https://grid.ai.juspay.net) is a LiteLLM proxy
# speaking OpenAI-compatible /v1, so adding a model later is one entry here and
# nothing else. `uv run python -m hq.cli models` lists everything the gateway
# serves and flags entries it no longer has.
#
# Pricing is per 1M tokens and drives our own cost accounting: gateway aliases
# cannot be priced by any public pricing library, so these numbers are the
# source of truth. Set them to 0 if internal usage is not billed to you.

models:
  kimi:
    provider: gateway
    model: kimi-latest    # 256k context
    input_per_mtok: 0.60
    output_per_mtok: 2.50
    # kimi-latest is a reasoning model. "low" answered in tens of seconds and
    # was the default while cost was the constraint. On 2026-09-10 the owner
    # said the constraint is value, not money: "use the model with high or
    # extra high efforts ... i want value don't care about the money for now".
    # High effort spends thousands of hidden reasoning tokens per call, so the
    # per-call timeout goes up with it, and max_tokens rises so a long note or
    # a big tool argument is not cut off mid-sentence.
    settings:
      reasoning_effort: high
      max_tokens: 16000
      timeout_s: 300
    # When the gateway answers kimi with a timeout or a connection error,
    # try these instead rather than failing the run. Ten of twenty-three run
    # failures in the week to 2026-09-08 were exactly that, and every role
    # pointed at this one model, so one flaky model stopped everything.
    fallback: [sonnet, glm]

  # Fallback spares. They are priced at their public list price, which the
  # gateway may not match; that only matters if an agent declares one as its
  # own model, because a run is costed at the model its manifest names.
  sonnet:
    provider: gateway
    model: claude-sonnet-4-6
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    settings:
      max_tokens: 16000
      timeout_s: 300

  glm:
    provider: gateway
    model: glm-latest
    input_per_mtok: 0.60
    output_per_mtok: 2.20
    settings:
      max_tokens: 16000
      timeout_s: 300

# Roles are what agents declare. All three point at one model for now; split
# them (deep -> a stronger model, cheap -> a faster one) by editing these three
# lines, with no change to any agent or any code.
roles:
  deep: kimi
  default: kimi
  cheap: kimi

# Vault semantic search (memory.py). One model, no pricing: embedding calls
# are not billed to our cost accounting. `dimensions` is sent as the OpenAI
# `dimensions` parameter; the gateway truncates gemini-embedding-001's native
# 3072-dim vector to 768 so it fits a pgvector HNSW index (max 2000 dims).
# Changing it requires a new migration (the column is vector(768)) and a
# full reindex. Verified 2026-09-02: the gateway honors dimensions=768.
embeddings:
  provider: gateway
  model: gemini-embedding-001
  dimensions: 768
