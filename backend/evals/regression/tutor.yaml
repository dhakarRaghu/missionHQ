# Tutor: the lessons he reads. Real briefs, real study notes and course
# sources (read for real), lesson tools writing into a throwaway learning/.

- id: tutor-article-paper-day
  agent: tutor
  source: >-
    The paper-day article of 2026-09-22/23 (Orca and PagedAttention). It never
    finished: page-wide refusals, three full rewrites, then a single turn too
    long for any model's time limit. An article carries one idea, taught, not
    a history of who measured what.
  brief_from_task: a3f49b44
  real: [load_skill, vault_read, vault_list, read_course_source, read_lesson,
         lesson_draft, write_lesson_part, write_lesson]
  canned:
    record_lesson: {recorded: true, lesson_id: eval-lesson}
    list_readings: []
    notify_owner: {sent: true}
    recall_facts: []
    memory_search: []
  expect:
    calls: [write_lesson_part, record_lesson]
    lesson_written: true
  judge:
    - The article teaches exactly one idea, stated as a claim he could be wrong about.
    - It asks him to predict before it explains (a predict question comes before the answer).
    - It is about how the mechanism works now, not a history of who published what and when.
    - Every constant used in arithmetic is named with its unit before the first number that uses it.
  request_limit: 60

- id: tutor-phase-2b
  agent: tutor
  source: >-
    Phase 2B of Inference Internals. The page of 2026-09-22 passed every check
    and taught nothing: a survey of versions and papers, 237 numbers, a
    version table offered as a concept. He wants three to five concepts a
    teacher would pick, each one he could predict from afterwards.
  brief_from_task: 6f4d8b4a
  real: [load_skill, vault_read, vault_list, read_course_source, read_lesson,
         lesson_draft, write_lesson_part, write_lesson, list_courses]
  canned:
    record_lesson: {recorded: true, lesson_id: eval-lesson}
    list_readings: []
    notify_owner: {sent: true}
    recall_facts: []
    memory_search: []
  expect:
    calls: [write_lesson_part, record_lesson]
    lesson_written: true
  judge:
    - The page lists between three and five concepts, each a claim about how the system behaves.
    - No listed concept is a table of defaults or version numbers that the next release could make false.
    - Each concept section asks a predict question before explaining.
    - The page teaches mechanisms, not a history of versions, papers or who measured what.
    - Every constant used in arithmetic is named with its unit before the first number that uses it.
  request_limit: 80

- id: tutor-article-thin-material
  agent: tutor
  source: >-
    When the digests cannot support the article the brief asks for, tutor
    writes nothing and reports what the digests contain. A forced article
    costs his trust; an honest quiet day costs two minutes.
  prompt: |-
    Write today's article. Kind: spine_evidence. Relationship: measures.
    Phase: Inference Internals Phase 2A (inference-internals-phase-02a-scheduling-memory).
    Adds: a measured comparison of chunked prefill budgets on one real server.
    Hunter's digest: quarantine/eval-thin-digest.md
    Load the teaching and article skills first.
  real: [load_skill, read_course_source, lesson_draft, write_lesson_part, write_lesson]
  canned:
    vault_read: |-
      ---
      source_urls: [https://example.com/post]
      ---
      # A short note
      One blog post says chunked prefill "helps latency". It gives no numbers,
      no hardware, no version, and no workload. Nothing else was found.
    record_lesson: {recorded: true}
    list_readings: []
  expect:
    not_calls: [write_lesson, record_lesson]
  judge:
    - The answer says plainly that the material cannot support a measured article, and says what it does contain.
