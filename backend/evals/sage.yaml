- id: 7a5fa57e-2ae4-4db7-837e-f15cf320f257
  prompt: Write a 150-word explanation of why durable execution matters for unattended agents. Do not
    use tools.
  reference: 'Unattended agents run without anyone watching, so any failure is silent until the damage
    surfaces. Durable execution means the agent''s progress is persisted as it works: each completed step
    is checkpointed, and pending work survives a crash, restart, or redeploy. Without it, a process dying
    mid-task either loses everything (the task never finishes) or restarts from scratch and repeats side
    effects — sending the same email twice, charging a customer again. With durability, recovery means
    resuming'
  tags:
  - source:web
