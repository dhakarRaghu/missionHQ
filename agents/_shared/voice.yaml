# The owner's X register, measured from his own posts. Read by the register
# gate (hq.voice.register_problems, run on every vault_write under
# projects/content/drafts/) and meant to be injected into content briefs.
# Re-measure from his real posts when updating; never from memory.
measured_from:
  posts: 10
  note: quarantine/2026-09-10-operator-fc263764.md
measured:
  median_sentence_words: 8
  median_post_words: 87
  contractions_per_post: 3.1
  written_out_forms_per_post: 0.2
  i_think_family_per_post: 0.9
  em_dashes: 0
  emoji_hashtags_bullets_lists: 0
  negative_parallelism_copula_avoidance: 0
gate:
  min_apostrophes: 2
  max_written_out_forms: 1
  # A view is required, but "I think" is not. Of 41 posts read from nine
  # accounts in his field, almost none used the family; the strongest state
  # the view flatly ("the main appeal of X isn't Y, it's Z"). Required, it
  # made every post end on the same formula.
  min_i_think_family: 0
  # Shorter than this, a post is a one-line take: the contraction count and
  # the written-out limit do not apply to it.
  short_post_words: 40
  max_em_dashes: 0
  forbid: [emoji, hashtags, bullets, numbered_lists, thread_markers]
  # The full forms his posts contract. Counted as whole words, any case.
  written_out_forms:
    - it is
    - cannot
    - do not
    - does not
    - did not
    - is not
    - are not
    - was not
    - will not
    - would not
    - I am
    - we are
    - they are
    - you are
  i_think_family:
    - I think
    - I don't think
    - I do not think
    - I'd rather
    - I would rather
    - I suspect
  banned_openers:
    - "Here's why"
    - "Let that sink in"
    - "A thread:"
    - "Unpopular opinion:"
    - "Here's the thing"
    - "Let's be honest"
    - "In today's world"
  banned_closers:
    - "The lesson is"
    - "And that is why"
    - "the real lesson"
    - "table stakes"
    - "the easy half"
    - "the hard half"
    - engagement_request
  # What an engagement_request closer looks like.
  engagement_requests:
    - "what do you think"
    - "let me know"
    - "drop a comment"
    - "comment below"
    - "thoughts?"
    - "agree?"
    - "follow for more"
    - "like and share"
    - "repost if"
    - "DM me"
  planning_words:
    - pillar
    - highest-value
    - content strategy
    - audience rewards
    - strongest material
    - zero production cost
    - hook
    - why it matters
    - "Reason:"
    - "Needs:"
    - "What's needed:"
# The accounts read for these rules, and what their own posts showed. Only
# posts the account wrote, not reposts: 41 posts from nine accounts.
studied:
  accounts: [simonw, swyx, karpathy, eugeneyan, GergelyOrosz, chipro, rasbt, arpit_bhayani, nijansh]
  posts: 41
  seen:
    one_line_take: "a claim in one or two sentences, stated flatly (arpit_bhayani, rasbt, GergelyOrosz, simonw, nijansh)"
    add_to_news: "a comment on someone else's release or post that adds one number, mechanism or limit (simonw, chipro, rasbt, eugeneyan, karpathy, swyx)"
    breakdown: "an incident or a design explained in a few short lines, then a view (arpit_bhayani)"
    real_question: "a question he wants answered, with the reason he asks (chipro, GergelyOrosz)"
    how_i_work: "one pattern he uses and why it works (karpathy, simonw, eugeneyan)"
  not_seen: "none of them wrote a confession ending, a teaser that holds the point back, or an engagement ask"
rules:
  - 'One view per post, stated as his: flatly, or with "I think" when he is not sure.'
  - 'Every post stands on a fact: a number with its conditions, a mechanism, or a named event.'
  - 'Plain words; a claim he can defend in a reply. No hedges: cut "maybe", "arguably", "it is worth noting".'
  - Short lines, no furniture. No lists, no dashes, no emoji, no hashtags.
  - 'End on the view, the number or a question he means. Never a confession or a teaser.'
  - 'Invite, do not sell: "happy to help", never "DM me".'
openers:
  - "At this point the prefill is the cheap part."
  - "vLLM doesn't run a long prompt in one step."
  - "Cloudflare had an interesting incident this week, and it is all about one reused block."
  - "Why does every serving benchmark report the mean and not the tail?"
  - "One pattern I use when an agent keeps failing:"
reading_openers:
  - "I was reading how vLLM schedules prefill, and one detail changes how I read latency charts."
  - "A team measured this and the number surprised me."
