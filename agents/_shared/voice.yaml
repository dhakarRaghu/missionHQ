# The owner's X register, measured from his own posts. Read by the register
# gate (hq.voice.register_problems, run on every vault_write under
# projects/content/drafts/) and meant to be injected into content briefs.
# Re-measure from his real posts when updating; never from memory.
measured_from:
  posts: 10
  note: quarantine/2026-09-10-operator-fc263764.md
measured:
  median_sentence_words: 8
  median_post_words: 87
  contractions_per_post: 3.1
  written_out_forms_per_post: 0.2
  i_think_family_per_post: 0.9
  em_dashes: 0
  emoji_hashtags_bullets_lists: 0
  negative_parallelism_copula_avoidance: 0
gate:
  min_apostrophes: 2
  max_written_out_forms: 1
  min_i_think_family: 1
  max_em_dashes: 0
  forbid: [emoji, hashtags, bullets, numbered_lists, thread_markers]
  # The full forms his posts contract. Counted as whole words, any case.
  written_out_forms:
    - it is
    - cannot
    - do not
    - does not
    - did not
    - is not
    - are not
    - was not
    - will not
    - would not
    - I am
    - we are
    - they are
    - you are
  i_think_family:
    - I think
    - I don't think
    - I do not think
    - I'd rather
    - I would rather
    - I suspect
  banned_openers:
    - "Here's why"
    - "Let that sink in"
    - "A thread:"
    - "Unpopular opinion:"
    - "Here's the thing"
    - "Let's be honest"
    - "In today's world"
    - rhetorical_question
  banned_closers:
    - "The lesson is"
    - "And that is why"
    - "the real lesson"
    - "table stakes"
    - "the easy half"
    - "the hard half"
    - engagement_request
  # What an engagement_request closer looks like.
  engagement_requests:
    - "what do you think"
    - "let me know"
    - "drop a comment"
    - "comment below"
    - "thoughts?"
    - "agree?"
    - "follow for more"
    - "like and share"
    - "repost if"
    - "DM me"
  planning_words:
    - pillar
    - highest-value
    - content strategy
    - audience rewards
    - strongest material
    - zero production cost
    - hook
    - why it matters
    - "Reason:"
    - "Needs:"
    - "What's needed:"
rules:
  - 'Anchor on "I": every post starts or pivots on his lived experience.'
  - 'Flat claims; "I think" is him, not a hedge. Cut "maybe", "arguably", "it is worth noting".'
  - Trigger, then reflection, then insight.
  - Short lines, no furniture.
  - 'Invite, do not sell: "happy to help", never "DM me".'
  - Introspective and forward at once.
openers:
  - "I broke production three times last month."
  - "I don't think most support teams have a support problem."
  - "I've seen teams blame the AI when the real problem is..."
  - "Most support bots fail before they even reply."
  - "No one tells you this about..."
reading_openers:
  - "I was reading about how retrieval actually fails and it made me look at ours."
  - "Someone wrote this week that agents fail before they even start. I think that is right."
  - "Read a good breakdown of KV caching today. One line stuck."
