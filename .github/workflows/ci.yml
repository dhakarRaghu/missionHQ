# Every push and pull request: the backend's lint, types and tests, and the
# frontend's types and lint. No database: every test on main is pure (db.fetch
# is monkeypatched where a tool reads), and the model-backed regression set
# (hq.cli regress) is not run here; it costs money and needs the gateway, so it
# runs on the Mac from scripts/regress-nightly.sh.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # One test resolves a model from the registry, which builds a gateway
      # client without calling it. Placeholders let it build; no request goes
      # anywhere in the suite.
      GATEWAY_BASE_URL: http://127.0.0.1:9/v1
      GATEWAY_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
